<style>
  :root{
    --bg: #FBF3E7;
    --card: #FFFDF9;
    --border: #E4D7C4;
    --border-strong: #D8C6AE;
    --text: #5B4636;
    --text-sub: #8A7362;
    --danger: #C0392B;
    --home-bg: #DCE8F0;
    --home-text: #2F5770;
    --facility-bg: #E4EEDD;
    --facility-text: #3F5C34;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
    font-size:17px; -webkit-tap-highlight-color:transparent;}
  input,select,textarea,button{font-size:16px; font-family:inherit;}
  .screen{display:none; max-width:480px; margin:0 auto; padding:16px 16px 40px;}
  .screen.active{display:block;}
  h1{font-size:20px; font-weight:700; margin:8px 0 16px; text-align:center;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px;}
  .center{text-align:center;}
  .muted{color:var(--text-sub); font-size:14px;}
  button{border:none; border-radius:12px; cursor:pointer; padding:12px 16px; font-weight:700;}
  .btn-main{background:var(--text); color:#fff; width:100%;}
  .btn-outline{background:#fff; border:1px solid var(--border-strong); color:var(--text); width:100%;}
  .btn-link{background:none; color:var(--text-sub); text-decoration:underline; padding:8px;}

  /* passcode */
  #passcode-dots{display:flex; gap:12px; justify-content:center; margin:20px 0;}
  #passcode-dots div{width:44px; height:52px; border:1px solid var(--border-strong); border-radius:10px;
    display:flex; align-items:center; justify-content:center; font-size:26px; background:#fff;}
  #passcode-keys{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px;}
  #passcode-keys button{height:56px; font-size:22px; background:#fff; border:1px solid var(--border-strong);}
  #passcode-error{color:var(--danger); text-align:center; min-height:20px; font-size:14px;}

  /* search */
  .search-box{display:flex; align-items:center; gap:8px; border:1px solid var(--border-strong);
    border-radius:12px; padding:0 12px; height:48px; background:#fff; margin-bottom:16px;}
  .search-box input{border:none; outline:none; background:transparent; flex:1; font-size:17px; color:var(--text);}
  .result-item{border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; background:#fff; cursor:pointer;}
  .result-item .name{font-size:17px; font-weight:700;}
  .result-item .cat{font-size:14px; color:var(--text-sub); margin-top:2px;}

  .group-label{font-size:14px; color:var(--text-sub); margin:14px 0 8px;}
  .btn-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:8px;}
  .chip{height:56px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-size:15px; font-weight:700; line-height:1.25; cursor:pointer; padding:4px;}
  .chip.home{background:var(--home-bg); color:var(--home-text);}
  .chip.facility{background:var(--facility-bg); color:var(--facility-text);}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .iconbtn{background:none; color:var(--text-sub); font-size:22px; padding:4px 8px;}

  /* facility detail */
  .status-box{background:var(--bg); border-radius:12px; padding:16px; text-align:center; margin:14px 0;}
  .status-box .label{font-size:14px; color:var(--text-sub); margin-bottom:6px;}
  .status-box .value{color:var(--danger); font-weight:700;}
  .section-label{font-size:14px; color:var(--text-sub); margin:14px 0 4px;}
  .section-body{font-size:16px; line-height:1.8;}
  .em{color:var(--danger); font-weight:700;}

  label.field{display:block; margin-bottom:14px;}
  label.field span{display:block; font-size:14px; color:var(--text-sub); margin-bottom:6px;}
  label.field input, label.field select, label.field textarea{
    width:100%; padding:10px 12px; border:1px solid var(--border-strong); border-radius:10px; background:#fff; color:var(--text);}
  label.field textarea{resize:vertical; min-height:70px;}

  #loading{position:fixed; inset:0; background:rgba(251,243,231,0.9); display:flex; align-items:center;
    justify-content:center; font-size:16px; color:var(--text-sub); z-index:50;}
  #loading.hidden{display:none;}
</style>
</head>
<body>

<div id="loading" class="hidden">読み込み中…</div>

<!-- 画面1: パスコード -->
<div class="screen active" id="screen-passcode">
  <div style="padding-top:60px;">
    <div class="center" style="font-size:40px;">🔒</div>
    <h1>パスコードを入力</h1>
    <div id="passcode-dots"></div>
    <div id="passcode-error"></div>
    <div id="passcode-keys"></div>
    <div class="center" style="margin-top:20px;">
      <button class="btn-link" onclick="showChangePasscode()">パスコードを変更する</button>
    </div>
  </div>
</div>

<!-- 画面2: 検索・区分ボタン -->
<div class="screen" id="screen-search">
  <div class="topbar">
    <h1 style="margin:0;">施設区分検索</h1>
    <button class="iconbtn" onclick="pushNav({type:'search'}); goAdd()" aria-label="施設を追加">＋</button>
  </div>
  <div class="search-box">
    <span>🔍</span>
    <input type="text" id="search-input" placeholder="施設名で検索" oninput="onSearchInput()">
  </div>
  <div id="search-results"></div>
  <div id="category-groups"></div>
</div>

<!-- 画面3: 区分別一覧 -->
<div class="screen" id="screen-category-list">
  <div class="topbar">
    <button class="iconbtn" onclick="goSearch()" aria-label="戻る">←戻る</button>
  </div>
  <h1 id="category-list-title"></h1>
  <div id="category-list-results"></div>
</div>

<!-- 画面4: 施設詳細 -->
<div class="screen" id="screen-detail">
  <div class="topbar">
    <button class="iconbtn" onclick="goBack()" aria-label="戻る">←戻る</button>
  </div>
  <div class="card">
    <div id="detail-title" style="font-size:19px; font-weight:700; line-height:1.6;"></div>
    <div class="status-box">
      <div class="label">現在の状況</div>
      <div class="value" id="detail-status"></div>
    </div>
    <div class="section-label">現在のサービス</div>
    <div class="section-body" id="detail-service"></div>
    <div id="detail-fillin-wrap">
      <div class="section-label">記入すること</div>
      <div class="section-body" id="detail-fillin"></div>
    </div>
    <div id="detail-memo-wrap" style="margin-top:14px;">
      <div class="section-label">メモ</div>
      <div class="section-body" id="detail-memo"></div>
    </div>
    <button class="btn-outline" id="detail-edit-btn" style="margin-top:18px;" onclick="pushNav({type:'detail', id: currentFacilityId}); goEdit()">✏️ 編集する</button>
  </div>
</div>

<!-- 画面5: 追加・編集フォーム -->
<div class="screen" id="screen-form">
  <div class="topbar">
    <button class="iconbtn" onclick="goBack()" aria-label="戻る">←戻る</button>
  </div>
  <h1 id="form-title">施設を追加</h1>
  <div class="card">
    <label class="field">
      <span>施設名</span>
      <input type="text" id="form-name">
    </label>
    <label class="field">
      <span>施設区分</span>
      <select id="form-category"></select>
    </label>
    <label class="field">
      <span>メモ</span>
      <textarea id="form-memo"></textarea>
    </label>
    <div id="form-error" style="color:var(--danger); font-size:14px; margin-bottom:10px;"></div>
    <button class="btn-main" onclick="saveForm()">保存する</button>
  </div>
</div>

<script>
// ==== 設定 ====
// ここに、Google Apps Scriptを「ウェブアプリ」としてデプロイした後のURLを貼り付けてください
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJxWkp5LqIGcQ1io1Lpnu5oSzwScUp3Db0ayaRvDhjVx6JiMo8Ag4ZlDB7ZsZkCwM/exec";

// ==== 状態 ====
let PASSCODE = "";
let categories = [];
let facilities = [];
let currentCategory = null;
let currentFacilityId = null;
let editingId = null;
let navStack = []; // 戻るボタン用の画面遷移履歴

function pushNav(view){ navStack.push(view); }
function goBack(){
  const prev = navStack.pop();
  if(!prev){ goSearch(); return; }
  if(prev.type === 'search'){ goSearch(); }
  else if(prev.type === 'categoryList'){ openCategoryList(prev.category); }
  else if(prev.type === 'detail'){ openDetail(prev.id); }
  else { goSearch(); }
}

function showLoading(v){ document.getElementById('loading').classList.toggle('hidden', !v); }
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

// ==== パスコード画面 ====
let pinInput = "";
function renderPasscodeDots(){
  const wrap = document.getElementById('passcode-dots');
  wrap.innerHTML = "";
  for(let i=0;i<4;i++){
    const d = document.createElement('div');
    d.textContent = i < pinInput.length ? "●" : "";
    wrap.appendChild(d);
  }
}
function renderPasscodeKeys(){
  const wrap = document.getElementById('passcode-keys');
  wrap.innerHTML = "";
  const keys = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
  keys.forEach(k=>{
    const b = document.createElement('button');
    b.textContent = k;
    if(k === ""){ b.style.visibility = "hidden"; }
    b.onclick = ()=> onKeyPress(k);
    wrap.appendChild(b);
  });
}
function onKeyPress(k){
  if(k === "⌫"){ pinInput = pinInput.slice(0,-1); }
  else if(k !== "" && pinInput.length < 4){ pinInput += k; }
  renderPasscodeDots();
  document.getElementById('passcode-error').textContent = "";
  if(pinInput.length === 4){ submitPasscode(); }
}
function submitPasscode(){
  showLoading(true);
  fetch(APPS_SCRIPT_URL + "?passcode=" + encodeURIComponent(pinInput))
    .then(r=>r.json())
    .then(res=>{
      showLoading(false);
      if(!res.ok){
        document.getElementById('passcode-error').textContent = "パスコードが違います";
        pinInput = "";
        renderPasscodeDots();
        return;
      }
      PASSCODE = pinInput;
      categories = res.categories;
      facilities = res.facilities;
      goSearch();
    })
    .catch(()=>{
      showLoading(false);
      document.getElementById('passcode-error').textContent = "通信エラーが発生しました";
      pinInput = ""; renderPasscodeDots();
    });
}
function showChangePasscode(){
  const cur = prompt("現在のパスコード(4桁)を入力してください");
  if(cur === null) return;
  const next = prompt("新しいパスコード(4桁)を入力してください");
  if(next === null) return;
  if(!/^[0-9]{4}$/.test(next)){ alert("4桁の数字で入力してください"); return; }
  showLoading(true);
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({passcode: cur, action:"changePasscode", newPasscode: next})
  }).then(r=>r.json()).then(res=>{
    showLoading(false);
    if(res.ok){ alert("パスコードを変更しました"); }
    else { alert("現在のパスコードが違います"); }
  }).catch(()=>{ showLoading(false); alert("通信エラーが発生しました"); });
}

// ==== 検索画面 ====
function goSearch(){
  navStack = [];
  showScreen('screen-search');
  document.getElementById('search-input').value = "";
  document.getElementById('search-results').innerHTML = "";
  renderCategoryGroups();
}
function onSearchInput(){
  const q = document.getElementById('search-input').value.trim();
  const wrap = document.getElementById('search-results');
  wrap.innerHTML = "";
  if(!q){ return; }
  const hits = facilities.filter(f => f.name.includes(q));
  hits.forEach(f => wrap.appendChild(makeResultItem(f)));
  if(hits.length === 0){
    wrap.innerHTML = '<div class="muted center" style="padding:16px 0;">該当する施設が見つかりません</div>';
  }
}
function makeResultItem(f){
  const div = document.createElement('div');
  div.className = "result-item";
  div.innerHTML = `<div class="name">${escapeHtml(f.name)}</div><div class="cat">${escapeHtml(f.category)}</div>`;
  div.onclick = ()=> { pushNav({type:'search'}); openDetail(f.id); };
  return div;
}
function renderCategoryGroups(){
  const wrap = document.getElementById('category-groups');
  wrap.innerHTML = "";
  ["在宅","施設"].forEach(group=>{
    const label = document.createElement('div');
    label.className = "group-label";
    label.textContent = group;
    wrap.appendChild(label);
    const grid = document.createElement('div');
    grid.className = "btn-grid";
    categories.filter(c=>c.group === group).forEach(c=>{
      const chip = document.createElement('div');
      chip.className = "chip " + (group === "在宅" ? "home" : "facility");
      chip.innerHTML = escapeHtml(c.shortName).replace(/\n/g,"<br>");
      chip.onclick = ()=> { pushNav({type:'search'}); openCategoryList(c.fullName); };
      grid.appendChild(chip);
    });
    wrap.appendChild(grid);
  });
}

// ==== 区分別一覧 ====
function openCategoryList(fullName){
  const hits = facilities.filter(f=>f.category === fullName);
  if(hits.length === 0){
    // 該当施設が0件の区分は、一覧を出さず区分自体の状況ページに直接遷移する
    openCategoryOnlyDetail(fullName);
    return;
  }
  currentCategory = fullName;
  document.getElementById('category-list-title').textContent = fullName;
  const wrap = document.getElementById('category-list-results');
  wrap.innerHTML = "";
  hits.forEach(f=>{
    const div = document.createElement('div');
    div.className = "result-item";
    div.innerHTML = `<div class="name">${escapeHtml(f.name)}</div>`;
    div.onclick = ()=> { pushNav({type:'categoryList', category: fullName}); openDetail(f.id); };
    wrap.appendChild(div);
  });
  showScreen('screen-category-list');
}

// 施設名を持たない区分（在宅サービス利用なし/ありなど）専用の状況ページ
function openCategoryOnlyDetail(fullName){
  currentFacilityId = null;
  const cat = categories.find(c=>c.fullName === fullName) || {};
  document.getElementById('detail-title').innerHTML = `${escapeHtml(cat.fullName || "")}です`;

  const statusEl = document.getElementById('detail-status');
  const status = cat.status || "";
  statusEl.textContent = status;
  if(/^[0-9]+$/.test(status)){
    statusEl.style.fontSize = "44px";
  } else if(status.length > 10){
    statusEl.style.fontSize = "16px";
  } else {
    statusEl.style.fontSize = "22px";
  }

  document.getElementById('detail-service').textContent = cat.service || "";

  const fillinWrap = document.getElementById('detail-fillin-wrap');
  if(cat.fillIn && cat.fillIn.trim() !== ""){
    fillinWrap.style.display = "";
    document.getElementById('detail-fillin').innerHTML = renderFillIn(cat.fillIn);
  } else {
    fillinWrap.style.display = "none";
  }

  document.getElementById('detail-memo-wrap').style.display = "none";
  document.getElementById('detail-edit-btn').style.display = "none";
  showScreen('screen-detail');
}

// ==== 施設詳細 ====
function openDetail(id){
  currentFacilityId = id;
  const f = facilities.find(x=>x.id === id);
  if(!f) return;
  const cat = categories.find(c=>c.fullName === f.category) || {};
  document.getElementById('detail-title').textContent = `${f.name}は\n${cat.fullName || ""}です`;
  document.getElementById('detail-title').innerHTML = `${escapeHtml(f.name)}は<br>${escapeHtml(cat.fullName||"")}です`;

  const statusEl = document.getElementById('detail-status');
  const status = cat.status || "";
  statusEl.textContent = status;
  if(/^[0-9]+$/.test(status)){
    statusEl.style.fontSize = "44px";
  } else if(status.length > 10){
    statusEl.style.fontSize = "16px";
  } else {
    statusEl.style.fontSize = "22px";
  }

  document.getElementById('detail-service').textContent = cat.service || "";

  const fillinWrap = document.getElementById('detail-fillin-wrap');
  if(cat.fillIn && cat.fillIn.trim() !== ""){
    fillinWrap.style.display = "";
    document.getElementById('detail-fillin').innerHTML = renderFillIn(cat.fillIn);
  } else {
    fillinWrap.style.display = "none";
  }

  const memoWrap = document.getElementById('detail-memo-wrap');
  if(f.memo && f.memo.trim() !== ""){
    memoWrap.style.display = "";
    document.getElementById('detail-memo').textContent = f.memo;
  } else {
    memoWrap.style.display = "none";
  }
  document.getElementById('detail-edit-btn').style.display = "";

  showScreen('screen-detail');
}
// ##で囲まれた部分を赤字にする
function renderFillIn(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/##(.+?)##/g, '<span class="em">$1</span>').replace(/\n/g,"<br>");
}

// ==== 追加・編集フォーム ====
function goAdd(){
  editingId = null;
  document.getElementById('form-title').textContent = "施設を追加";
  document.getElementById('form-name').value = "";
  document.getElementById('form-memo').value = "";
  fillCategorySelect();
  document.getElementById('form-error').textContent = "";
  showScreen('screen-form');
}
function goEdit(){
  const f = facilities.find(x=>x.id === currentFacilityId);
  if(!f) return;
  editingId = f.id;
  document.getElementById('form-title').textContent = "施設を編集";
  document.getElementById('form-name').value = f.name;
  document.getElementById('form-memo').value = f.memo || "";
  fillCategorySelect(f.category);
  document.getElementById('form-error').textContent = "";
  showScreen('screen-form');
}
function fillCategorySelect(selected){
  const sel = document.getElementById('form-category');
  sel.innerHTML = "";
  categories.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c.fullName;
    opt.textContent = c.fullName;
    if(c.fullName === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}
function saveForm(){
  const name = document.getElementById('form-name').value.trim();
  const category = document.getElementById('form-category').value;
  const memo = document.getElementById('form-memo').value.trim();
  if(!name){
    document.getElementById('form-error').textContent = "施設名を入力してください";
    return;
  }
  const payload = { passcode: PASSCODE, facility: { id: editingId, name, category, memo } };
  payload.action = editingId ? "update" : "add";
  showLoading(true);
  fetch(APPS_SCRIPT_URL, {
    method: "POST",
    headers: {"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify(payload)
  }).then(r=>r.json()).then(res=>{
    showLoading(false);
    if(!res.ok){
      document.getElementById('form-error').textContent = "保存に失敗しました";
      return;
    }
    if(editingId){
      const f = facilities.find(x=>x.id === editingId);
      f.name = name; f.category = category; f.memo = memo;
    } else {
      facilities.push({ id: res.id, name, category, memo, createdAt:"", updatedAt:"" });
    }
    goSearch();
  }).catch(()=>{
    showLoading(false);
    document.getElementById('form-error').textContent = "通信エラーが発生しました";
  });
}

function escapeHtml(s){
  return String(s || "").replace(/[&<>"']/g, c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// 初期化
renderPasscodeDots();
renderPasscodeKeys();
</script>
</body>
</html>
